<text x="800" y="315" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="32" font-weight="800" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">Trace</tspan></text>
<text x="800" y="375" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">何时发生？</tspan><tspan x="800" dy="40.8">关键路径多慢？</tspan><tspan x="800" dy="40.8">哪里重试或取消？</tspan></text>
