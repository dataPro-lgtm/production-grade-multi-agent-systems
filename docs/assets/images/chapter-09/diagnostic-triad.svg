<text x="285" y="375" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="285" dy="0">为什么依赖？</tspan><tspan x="285" dy="40.8">Claim 由谁支持？</tspan><tspan x="285" dy="40.8">错误传播到哪里？</tspan></text>
