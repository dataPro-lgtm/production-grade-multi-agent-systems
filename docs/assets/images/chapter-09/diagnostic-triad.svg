<text x="1315" y="375" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="24" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1315" dy="0">当时看到了什么？</tspan><tspan x="1315" dy="40.8">Prompt / Tool Result</tspan><tspan x="1315" dy="40.8">Policy / Evidence</tspan></text>
