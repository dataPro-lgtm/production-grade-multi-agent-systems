<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" focusable="false" data-whiteboard-version="3">
<title id="whiteboard-title">诊断三件套：Graph × Trace × Artifact</title>
<desc id="whiteboard-desc">《生产级多智能体系统》第 09 章架构图，使用确定性白板线框表达控制流、证据或责任边界。</desc>

