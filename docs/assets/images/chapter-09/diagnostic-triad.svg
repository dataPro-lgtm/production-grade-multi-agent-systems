<text x="800" y="712" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="31" font-weight="800" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Incident Reconstruction</tspan></text>
<text x="800" y="752" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">找到第一个因果错误，不只修饰最终答案</tspan></text>
<text x="800" y="845" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="25" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">敏感原文进入受控 Artifact；Trace 与 Graph 只保存最小属性和引用。</tspan></text>

