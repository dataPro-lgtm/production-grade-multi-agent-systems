<title id="whiteboard-title">診断の三点セット：Graph × Trace × Artifact</title>
<desc id="whiteboard-desc">『プロダクショングレード・マルチエージェントシステム』第09章のアーキテクチャ図。決定論的なホワイトボード・ワイヤーフレームで制御フロー、エビデンス、責任境界を表現。</desc>

