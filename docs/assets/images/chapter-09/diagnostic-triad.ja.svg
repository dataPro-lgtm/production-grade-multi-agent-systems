<text x="285" y="315" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="29.4" font-weight="800" fill="#2f7d67" text-anchor="middle"><tspan x="285" dy="0">Context Graph</tspan></text>
<text x="285" y="375" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="285" dy="0">なぜ依存するのか？</tspan><tspan x="285" dy="40.8">Claimは誰が裏づけるか？</tspan><tspan x="285" dy="40.8">エラーはどこまで伝播したか？</tspan></text>
<rect x="605" y="255" width="390" height="310" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="4"/><rect x="607" y="254" width="389" height="311" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".28" transform="rotate(.18 800 410)"/>
<text x="800" y="315" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="29.4" font-weight="800" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">Trace</tspan></text>
<text x="800" y="375" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">いつ発生したか？</tspan><tspan x="800" dy="40.8">クリティカルパスはどれほど遅かったか？</tspan><tspan x="800" dy="40.8">どこで再試行またはキャンセルしたか？</tspan></text>
<rect x="1120" y="255" width="390" height="310" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="4"/><rect x="1122" y="254" width="389" height="311" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".28" transform="rotate(.18 1315 410)"/>
<text x="1315" y="315" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="29.4" font-weight="800" fill="#d97706" text-anchor="middle"><tspan x="1315" dy="0">Artifact</tspan></text>
<text x="1315" y="375" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1315" dy="0">当時何が見えていたか？</tspan><tspan x="1315" dy="40.8">Prompt / Tool Result</tspan><tspan x="1315" dy="40.8">Policy / Evidence</tspan></text>
