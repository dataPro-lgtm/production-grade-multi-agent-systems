<text x="800" y="712" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="800" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Incident Reconstruction</tspan></text>
<text x="800" y="752" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">最初の因果エラーを見つけ、最終回答だけを整えない</tspan></text>
<text x="800" y="845" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">機密の原文は制御されたArtifactへ格納し、TraceとGraphには最小限の属性と参照のみを保存する。</tspan></text>

