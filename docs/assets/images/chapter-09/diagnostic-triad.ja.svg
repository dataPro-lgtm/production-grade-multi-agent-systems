<text x="70" y="82" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="800" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">診断の三点セット：Graph × Trace × Artifact</tspan></text><text x="72" y="128" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">同一インシデントの関係、時間、原資料を相互にたどれるようにする。</tspan></text><path d="M 70 160 C 556.6666666666666 158, 1043.3333333333333 162, 1530 160" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/>
