<text x="130" y="620" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="800" fill="#d97706" text-anchor="start"><tspan x="130" dy="0">Work backward</tspan></text>
<text x="320" y="620" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="320" dy="0">Who was affected?</tspan></text>
<text x="500" y="620" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="500" dy="0">Which version?</tspan></text>
<text x="700" y="620" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="700" dy="0">Which contract failed first?</tspan></text>
<text x="970" y="620" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="970" dy="0">How did the error propagate?</tspan></text>
<text x="1225" y="620" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="1225" dy="0">Why did safeguards miss it?</tspan></text>
<text x="800" y="685" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">Alert → representative Goal → Plan → Route → Tool → Context → Evidence → Answer</tspan></text>
<text x="800" y="820" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="23" font-weight="760" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Do not just append a Prompt after the Answer; fix the contract, affected state, evaluation cases, and detection capability.</tspan></text>

