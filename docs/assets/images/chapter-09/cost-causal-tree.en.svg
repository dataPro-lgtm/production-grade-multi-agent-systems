<text x="70" y="82" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="800" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">Cost causal tree: tie every expense to Goal Outcome</tspan></text><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">The total bill only shows how much was spent; causal attribution reveals whether it was worthwhile.</tspan></text><path d="M 70 160 C 556.6666666666666 158, 1043.3333333333333 162, 1530 160" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/>
<rect x="620" y="205" width="360" height="100" rx="34" fill="#f1f8f5" stroke="#2f7d67" stroke-width="4"/><rect x="622" y="204" width="359" height="101" rx="35" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".28" transform="rotate(.18 800 255)"/>
