<text x="360" y="717" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="15.6" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="360" dy="0">Did cost deliver user value?</tspan></text>
<rect x="580" y="635" width="440" height="115" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="3"/><rect x="582" y="634" width="439" height="116" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".28" transform="rotate(.18 800 692.5)"/>
