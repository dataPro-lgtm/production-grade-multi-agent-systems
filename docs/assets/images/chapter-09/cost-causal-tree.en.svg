<text x="800" y="717" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="15.6" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">Failures, drops, duplicates, and no-value work</tspan></text>
<rect x="1020" y="635" width="440" height="115" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/><rect x="1022" y="634" width="439" height="116" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".28" transform="rotate(.18 1240 692.5)"/>
<text x="1240" y="680" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="800" fill="#173a63" text-anchor="middle"><tspan x="1240" dy="0">Critical Path / Evidence Cost</tspan></text>
<text x="1240" y="717" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="15.6" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1240" dy="0">Effort truly required to achieve the goal</tspan></text>
<text x="800" y="825" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="23" font-weight="760" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">When the budget is insufficient, explicitly degrade or block; never silently remove required Evidence.</tspan></text>

