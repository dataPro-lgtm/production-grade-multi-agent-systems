<text x="800" y="284" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="15.6" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">success · partial · failed · blocked</tspan></text>
