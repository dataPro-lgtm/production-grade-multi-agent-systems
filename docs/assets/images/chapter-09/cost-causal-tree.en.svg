<title id="whiteboard-title">Cost causal tree: tie every expense to Goal Outcome</title>
<desc id="whiteboard-desc">Chapter 09 architecture diagram for Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow, evidence, or responsibility boundaries.</desc>

