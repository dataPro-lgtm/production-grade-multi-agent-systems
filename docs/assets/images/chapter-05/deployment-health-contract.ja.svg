<rect x="980" y="545" width="240" height="52" rx="26" fill="#ffffff" stroke="#2f7d67" stroke-width="2.4"/><rect x="982" y="544" width="239" height="53" rx="27" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1100 571)"/><text x="1100" y="579" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="700" fill="#2f7d67" text-anchor="middle"><tspan x="1100" dy="0">失敗：トラフィックから除外</tspan></text>
