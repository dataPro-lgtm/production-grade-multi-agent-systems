<text x="800" y="690" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">Readiness：必須依存関係とバージョンを低コストで確認。Synthetic：エンドツーエンドの業務不変条件を低頻度で検証。</tspan></text>
<text x="800" y="755" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">外部依存関係の一時障害で、Livenessが再起動ストームを引き起こしてはなりません。</tspan></text>

