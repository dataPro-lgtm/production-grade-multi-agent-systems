<path d="M 380 786 C 426.6666666666667 784, 473.3333333333333 788, 520 786" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)"/>
<rect x="520" y="760" width="270" height="52" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4"/><rect x="522" y="759" width="269" height="53" rx="27" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 655 786)"/><text x="655" y="794" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle"><tspan x="655" dy="0">单层负责重试</tspan></text>
<path d="M 790 786 C 836.6666666666666 784, 883.3333333333334 788, 930 786" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)"/>
