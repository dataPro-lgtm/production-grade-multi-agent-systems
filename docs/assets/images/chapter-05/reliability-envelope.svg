<path d="M 1230 786 C 1276.6666666666667 784, 1323.3333333333333 788, 1370 786" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)"/>
<rect x="1370" y="760" width="150" height="52" rx="26" fill="#ffffff" stroke="#173a63" stroke-width="2.4"/><rect x="1372" y="759" width="149" height="53" rx="27" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 1445 786)"/><text x="1445" y="794" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="22" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="1445" dy="0">可证明</tspan></text>
<text x="800" y="690" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">错误分类决定：重试、快速失败、降级、进 DLQ，还是人工升级。</tspan></text>

