<rect width="1600" height="900" fill="#fffdf9"/>
<g id="whiteboard-surface" aria-hidden="true" opacity=".22">
  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M 20 180 C 420 171, 920 190, 1580 177 M 30 718 C 530 727, 980 707, 1570 721" stroke="#e7dfce" stroke-width="2" fill="none" opacity=".52"/>

<text x="70" y="76" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="43" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">可靠性保护层：限制等待、放大与故障扩散</tspan></text><path d="M 70 94 C 265 87, 485 102, 710 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">每一层解决不同问题；最危险的反模式是多层无界重试和无限排队。</tspan></text>
<rect x="75" y="225" width="1450" height="500" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="4"/><rect x="77" y="224" width="1449" height="501" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 475)"/>
<text x="115" y="275" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="28" font-weight="760" fill="#c73e3e" text-anchor="start"><tspan x="115" dy="0">Deadline / 全局预算</tspan></text>
<rect x="145" y="305" width="1310" height="360" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="4"/><rect x="147" y="304" width="1309" height="361" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 485)"/>
<text x="185" y="355" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="27" font-weight="740" fill="#d97706" text-anchor="start"><tspan x="185" dy="0">Timeout + 有界 Retry / Jitter</tspan></text>
<rect x="215" y="385" width="1170" height="220" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="4"/><rect x="217" y="384" width="1169" height="221" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 495)"/>
<text x="255" y="435" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="27" font-weight="740" fill="#173a63" text-anchor="start"><tspan x="255" dy="0">Circuit Breaker + Bulkhead + Rate Limit</tspan></text>
<rect x="420" y="470" width="760" height="90" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="4"/><rect x="422" y="469" width="759" height="91" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 515)"/>
<text x="800" y="525" font-family="'Kaiti SC','STKaiti','Noto Sans SC',sans-serif" font-size="28" font-weight="760" fill="#2f7d67" text-anchor="middle"><tspan x="800" dy="0">Queue / DLQ / Backpressure / Idempotency</tspan></text>
