  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M 20 180 C 420 171, 920 190, 1580 177 M 30 718 C 530 727, 980 707, 1570 721" stroke="#e7dfce" stroke-width="2" fill="none" opacity=".52"/>

<text x="70" y="76" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">信頼性保護レイヤー：待機、増幅、障害伝播を制限</tspan></text><path d="M 70 94 C 265 87, 485 102, 710 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">各レイヤーの役割は異なります。最も危険なアンチパターンは、複数レイヤーでの無制限リトライと無限キューです。</tspan></text>
<rect x="75" y="225" width="1450" height="500" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="4"/><rect x="77" y="224" width="1449" height="501" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 475)"/>
<text x="115" y="275" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="25.8" font-weight="760" fill="#c73e3e" text-anchor="start"><tspan x="115" dy="0">Deadline / 全体予算</tspan></text>
<rect x="145" y="305" width="1310" height="360" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="4"/><rect x="147" y="304" width="1309" height="361" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 485)"/>
<text x="185" y="355" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="740" fill="#d97706" text-anchor="start"><tspan x="185" dy="0">Timeout + 有界Retry / Jitter</tspan></text>
<rect x="215" y="385" width="1170" height="220" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="4"/><rect x="217" y="384" width="1169" height="221" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 495)"/>
<text x="255" y="435" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="740" fill="#173a63" text-anchor="start"><tspan x="255" dy="0">Circuit Breaker + Bulkhead + Rate Limit</tspan></text>
<rect x="420" y="470" width="760" height="90" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="4"/><rect x="422" y="469" width="759" height="91" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 515)"/>
<text x="800" y="525" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="25.8" font-weight="760" fill="#2f7d67" text-anchor="middle"><tspan x="800" dy="0">Queue / DLQ / Backpressure / Idempotency</tspan></text>
<rect x="80" y="760" width="300" height="52" rx="26" fill="#ffffff" stroke="#c73e3e" stroke-width="2.4"/><rect x="82" y="759" width="299" height="53" rx="27" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 230 786)"/><text x="230" y="794" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="230" dy="0">入口：絶対Deadline</tspan></text>
<path d="M 380 786 C 426.6666666666667 784, 473.3333333333333 788, 520 786" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)"/>
<rect x="520" y="760" width="270" height="52" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4"/><rect x="522" y="759" width="269" height="53" rx="27" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 655 786)"/><text x="655" y="794" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="700" fill="#d97706" text-anchor="middle"><tspan x="655" dy="0">リトライは1レイヤーのみ</tspan></text>
<path d="M 790 786 C 836.6666666666666 784, 883.3333333333334 788, 930 786" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)"/>
<rect x="930" y="760" width="300" height="52" rx="26" fill="#ffffff" stroke="#2f7d67" stroke-width="2.4"/><rect x="932" y="759" width="299" height="53" rx="27" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1080 786)"/><text x="1080" y="794" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="700" fill="#2f7d67" text-anchor="middle"><tspan x="1080" dy="0">過負荷：拒否または縮退</tspan></text>
<path d="M 1230 786 C 1276.6666666666667 784, 1323.3333333333333 788, 1370 786" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)"/>
<rect x="1370" y="760" width="150" height="52" rx="26" fill="#ffffff" stroke="#173a63" stroke-width="2.4"/><rect x="1372" y="759" width="149" height="53" rx="27" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 1445 786)"/><text x="1445" y="794" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="1445" dy="0">証明可能</tspan></text>
<text x="800" y="690" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">エラー分類が、リトライ、即時失敗、縮退、DLQ送信、人間へのエスカレーションを決めます。</tspan></text>

<text id="whiteboard-footer" x="1525" y="862" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16.6" fill="#526a82" text-anchor="end">プロダクショングレード・マルチエージェントシステム · 第05章</text>
