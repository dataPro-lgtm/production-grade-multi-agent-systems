<text x="800" y="704" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">失われたSoTは類似度インデックスでは復元できません。派生インデックスはバージョン化されたソースから再構築可能でなければなりません。</tspan></text>
<text x="800" y="758" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23" font-weight="700" fill="#2f7d67" text-anchor="middle"><tspan x="800" dy="0">インスタンス再起動 → Checkpoint読込 → バージョン検証 → 続行または安全に停止</tspan></text>

