<path d="M 20 180 C 420 171, 920 190, 1580 177 M 30 718 C 530 727, 980 707, 1570 721" stroke="#e7dfce" stroke-width="2" fill="none" opacity=".52"/>

<text x="70" y="76" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">From process startup to business-ready: a five-layer health contract</tspan></text><path d="M 70 94 C 265 87, 485 102, 710 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">Each layer answers a different question and triggers a different failure action; one vague /health endpoint is not enough.</tspan></text>
<rect x="65" y="335" width="240" height="145" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/><rect x="67" y="334" width="239" height="146" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 185 407.5)"/>
<text x="185" y="385" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="24.6" font-weight="720" fill="#173a63" text-anchor="middle"><tspan x="185" dy="0">Process</tspan></text>
<text x="185" y="427" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="16.4" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="185" dy="0">Does the entry command exist?</tspan></text>
<rect x="370" y="335" width="240" height="145" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/><rect x="372" y="334" width="239" height="146" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 490 407.5)"/>
<text x="490" y="385" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="24.6" font-weight="720" fill="#d97706" text-anchor="middle"><tspan x="490" dy="0">Startup</tspan></text>
<text x="490" y="427" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="16.4" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="490" dy="0">Configuration and initialization complete</tspan></text>
<rect x="675" y="335" width="240" height="145" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="3"/><rect x="677" y="334" width="239" height="146" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 795 407.5)"/>
<text x="795" y="385" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="24.6" font-weight="720" fill="#c73e3e" text-anchor="middle"><tspan x="795" dy="0">Liveness</tspan></text>
<text x="795" y="427" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="16.4" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="795" dy="0">Can internal processing continue?</tspan></text>
<rect x="980" y="335" width="240" height="145" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/><rect x="982" y="334" width="239" height="146" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1100 407.5)"/>
<text x="1100" y="385" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="24.6" font-weight="720" fill="#2f7d67" text-anchor="middle"><tspan x="1100" dy="0">Readiness</tspan></text>
<text x="1100" y="427" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="16.4" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1100" dy="0">Can it accept new traffic?</tspan></text>
<rect x="1285" y="335" width="250" height="145" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="3"/><rect x="1287" y="334" width="249" height="146" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 1410 407.5)"/>
<text x="1410" y="385" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="24.6" font-weight="720" fill="#6d4ba0" text-anchor="middle"><tspan x="1410" dy="0">Synthetic</tspan></text>
<text x="1410" y="427" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="15.6" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1410" dy="0">Does the critical business path succeed?</tspan></text>
<path d="M 305 407 C 326.6666666666667 405, 348.3333333333333 409, 370 407" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1e3a5f)"/>
<path d="M 610 407 C 631.6666666666666 405, 653.3333333333334 409, 675 407" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)"/>
<path d="M 915 407 C 936.6666666666666 405, 958.3333333333334 409, 980 407" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)"/>
<path d="M 1220 407 C 1241.6666666666667 405, 1263.3333333333333 409, 1285 407" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)"/>
<rect x="380" y="545" width="220" height="52" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="2.4"/><rect x="382" y="544" width="219" height="53" rx="27" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 490 571)"/><text x="490" y="579" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle"><tspan x="490" dy="0">Failure: abort startup</tspan></text>
<rect x="685" y="545" width="220" height="52" rx="26" fill="#ffffff" stroke="#c73e3e" stroke-width="2.4"/><rect x="687" y="544" width="219" height="53" rx="27" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 795 571)"/><text x="795" y="579" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="795" dy="0">Failure: restart cautiously</tspan></text>
<rect x="980" y="545" width="240" height="52" rx="26" fill="#ffffff" stroke="#2f7d67" stroke-width="2.4"/><rect x="982" y="544" width="239" height="53" rx="27" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1100 571)"/><text x="1100" y="579" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#2f7d67" text-anchor="middle"><tspan x="1100" dy="0">Failure: remove from traffic</tspan></text>
<rect x="1285" y="545" width="250" height="52" rx="26" fill="#ffffff" stroke="#6d4ba0" stroke-width="2.4"/><rect x="1287" y="544" width="249" height="53" rx="27" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 1410 571)"/><text x="1410" y="579" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#6d4ba0" text-anchor="middle"><tspan x="1410" dy="0">Failure: alert / stop release</tspan></text>
<text x="800" y="690" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">Readiness: low-cost checks of hard dependencies and versions; Synthetic: low-frequency validation of end-to-end business invariants.</tspan></text>
<text x="800" y="755" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="23.8" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Brief failures in external dependencies should not let Liveness trigger a restart storm.</tspan></text>

