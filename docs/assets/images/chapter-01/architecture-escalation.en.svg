<title id="whiteboard-title">Architecture escalation is evidence-driven, not terminology-driven</title>
<desc id="whiteboard-desc">Chapter 01 architecture diagram for Production-Grade Multi-Agent Systems, using deterministic whiteboard line art to show control flow, evidence, and responsibility boundaries.</desc>

