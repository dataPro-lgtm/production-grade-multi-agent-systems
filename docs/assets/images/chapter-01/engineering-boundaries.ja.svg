<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" focusable="false" data-whiteboard-version="3" lang="ja">
<title id="whiteboard-title">Agentを分割するなら、実在するエンジニアリング境界に対応させる</title>
<desc id="whiteboard-desc">『プロダクショングレード・マルチエージェントシステム』第01章のアーキテクチャ図。決定論的なホワイトボードの線画で、制御フロー、エビデンス、責任境界を示します。</desc>

<defs><pattern id="whiteboard-paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="3" r=".7" fill="#d7dee7" opacity=".34"/>
  <circle cx="13" cy="11" r=".45" fill="#eadfce" opacity=".3"/>
</pattern><marker id="arrow-1e3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#173a63"/></marker><marker id="arrow-d59621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker><marker id="arrow-3c8d77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d67"/></marker><marker id="arrow-c94c4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c73e3e"/></marker><marker id="arrow-7651a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4ba0"/></marker><marker id="arrow-55708f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a82"/></marker></defs>
<rect width="1600" height="900" fill="#fffdf9"/>
<g id="whiteboard-surface" aria-hidden="true" opacity=".22">
  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M 18 177 C 420 169, 930 188, 1580 176 M 25 720 C 520 730, 1000 708, 1575 721" stroke="#e7dfce" stroke-width="2" fill="none" opacity=".55"/>

<text x="70" y="75" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">Agentを分割するなら、実在するエンジニアリング境界に対応させる</tspan></text>
<path d="M 70 94 C 270 87, 490 101, 720 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/>
<text x="72" y="130" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">役割名を付ける前に責任の違いを見極めます。Promptの数はアーキテクチャ境界ではありません。</tspan></text>
<rect x="600" y="330" width="400" height="190" rx="70" fill="#ffffff" stroke="#173a63" stroke-width="4"/>
<rect x="602" y="329" width="399" height="191" rx="71" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".3" transform="rotate(.15 800 425)"/>
<text x="800" y="395" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="34" font-weight="760" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">なぜ分割が必要か？</tspan></text>
<text x="800" y="445" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">認可・復旧・スケールを独立化できるか</tspan></text>
<text x="800" y="482" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">明確な担当者がいるか？</tspan></text>
<rect x="75" y="220" width="300" height="135" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/>
<rect x="77" y="219" width="299" height="136" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".3" transform="rotate(.15 225 287.5)"/>
<text x="225" y="270" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="720" fill="#173a63" text-anchor="middle"><tspan x="225" dy="0">ドメインと受け入れ検証</tspan></text>
<text x="225" y="313" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="225" dy="0">用語、ルール、成功基準</tspan></text>
<rect x="1225" y="220" width="300" height="135" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/>
<rect x="1227" y="219" width="299" height="136" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".3" transform="rotate(.15 1375 287.5)"/>
<text x="1375" y="270" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="720" fill="#d97706" text-anchor="middle"><tspan x="1375" dy="0">データとツール</tspan></text>
<text x="1375" y="313" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1375" dy="0">アクセス範囲、読み書き権限</tspan></text>
<rect x="55" y="565" width="320" height="135" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/>
<rect x="57" y="564" width="319" height="136" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".3" transform="rotate(.15 215 632.5)"/>
<text x="215" y="615" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="720" fill="#2f7d67" text-anchor="middle"><tspan x="215" dy="0">権限とID</tspan></text>
<text x="215" y="658" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="215" dy="0">委任、承認、最小権限</tspan></text>
<rect x="1225" y="565" width="320" height="135" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="3"/>
<rect x="1227" y="564" width="319" height="136" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".3" transform="rotate(.15 1385 632.5)"/>
<text x="1385" y="615" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="720" fill="#c73e3e" text-anchor="middle"><tspan x="1385" dy="0">状態と障害</tspan></text>
<text x="1385" y="658" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1385" dy="0">所有権、リトライ、フォールバック</tspan></text>
<rect x="625" y="655" width="350" height="115" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="3"/>
<rect x="627" y="654" width="349" height="116" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".3" transform="rotate(.15 800 712.5)"/>
<text x="800" y="700" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="720" fill="#6d4ba0" text-anchor="middle"><tspan x="800" dy="0">チームと運用責任</tspan></text>
<text x="800" y="740" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">リリース · SLO · 独立した容量</tspan></text>
<path d="M 375 290 C 450 288, 525 382, 600 380" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1e3a5f)"/>
<path d="M 1225 290 C 1150 288, 1075 382, 1000 380" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)"/>
<path d="M 375 630 C 453.3333333333333 628, 531.6666666666666 497, 610 495" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)"/>
<path d="M 1225 630 C 1146.6666666666667 628, 1068.3333333333333 497, 990 495" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)"/>
<path d="M 800 655 C 800 653, 800 522, 800 520" fill="none" stroke="#6d4ba0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7651a6)"/>
<text x="800" y="820" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23.9" font-weight="650" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">境界を独立してテストできないなら、分割しても通常は調整コストが増えるだけです。</tspan></text>

<text id="whiteboard-footer" x="1525" y="862" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16.6" fill="#526a82" text-anchor="end">プロダクショングレード・マルチエージェントシステム · 第01章</text>
</svg>