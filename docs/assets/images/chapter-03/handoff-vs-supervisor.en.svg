<text x="70" y="76" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="760" fill="#173a63" text-anchor="start" opacity="1"><tspan x="70" dy="0">One arrow, two ownership models</tspan></text><path d="M 70 94 C 260 88, 470 101, 680 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#526a82" text-anchor="start" opacity="1"><tspan x="72" dy="0">Handoff transfers current responsibility; Supervisor retains global ownership and delegates subtasks.</tspan></text>
