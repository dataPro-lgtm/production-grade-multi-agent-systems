<rect x="1070" y="530" width="420" height="115" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/><rect x="1072" y="529" width="419" height="116" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 1280 587.5)"/>
<text x="1280" y="573" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23" font-weight="700" fill="#d97706" text-anchor="middle" opacity="1"><tspan x="1280" dy="0">制御とエビデンス</tspan></text>
<text x="1280" y="612" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="1280" dy="0">Workflow · Ledger · Artifact · Trace</tspan></text>
<text x="800" y="795" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="700" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="800" dy="0">プロトコルは相互運用性を保証しますが、タスク分解、認可、エビデンス品質、全体収束の代替にはなりません。</tspan></text>

