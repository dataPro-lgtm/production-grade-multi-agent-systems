<title id="whiteboard-title">Patterns are five control structures, not a menu</title>
<desc id="whiteboard-desc">Chapter 03 architecture diagrams for Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow and evidence or responsibility boundaries.</desc>

