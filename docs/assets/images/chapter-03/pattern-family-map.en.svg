<text x="70" y="76" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="760" fill="#173a63" text-anchor="start" opacity="1"><tspan x="70" dy="0">Patterns are five control structures, not a menu</tspan></text><path d="M 70 94 C 260 88, 470 101, 680 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#526a82" text-anchor="start" opacity="1"><tspan x="72" dy="0">One system can combine patterns; each layer must state what problem it solves.</tspan></text>
<rect x="70" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#173a63" stroke-width="3"/><rect x="72" y="204" width="279" height="541" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 210 475)"/>
<rect x="105" y="235" width="210" height="52" rx="26" fill="#f3f7fb" stroke="#173a63" stroke-width="2.4"/><rect x="107" y="234" width="209" height="53" rx="27" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 210 261)"/><text x="210" y="269" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="210" dy="0">Stable task</tspan></text>
<text x="210" y="330" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="210" dy="0">Deterministic pipeline</tspan><tspan x="210" dy="34.56">Sequential</tspan><tspan x="210" dy="34.56">Chain-of-Agents</tspan></text>
<text x="210" y="485" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="210" dy="0">Path set by code</tspan><tspan x="210" dy="28.16">Predictable · testable</tspan><tspan x="210" dy="28.16">Best for stable steps</tspan></text>
<rect x="375" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#6d4ba0" stroke-width="3"/><rect x="377" y="204" width="279" height="541" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 515 475)"/>
<rect x="410" y="235" width="210" height="52" rx="26" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="2.4"/><rect x="412" y="234" width="209" height="53" rx="27" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 515 261)"/><text x="515" y="269" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="650" fill="#6d4ba0" text-anchor="middle" opacity="1"><tspan x="515" dy="0">Exploratory question</tspan></text>
<text x="515" y="330" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="650" fill="#6d4ba0" text-anchor="middle" opacity="1"><tspan x="515" dy="0">Search + deliberation</tspan><tspan x="515" dy="34.56">Tree-of-Thoughts</tspan><tspan x="515" dy="34.56">Magentic</tspan></text>
<text x="515" y="485" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="515" dy="0">Explore, score, replan</tspan><tspan x="515" dy="28.16">Bound width and depth</tspan><tspan x="515" dy="28.16">Goal contract unchanged</tspan></text>
<rect x="680" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="682" y="204" width="279" height="541" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 820 475)"/>
<rect x="715" y="235" width="210" height="52" rx="26" fill="#fff8e8" stroke="#d97706" stroke-width="2.4"/><rect x="717" y="234" width="209" height="53" rx="27" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 820 261)"/><text x="820" y="269" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="650" fill="#d97706" text-anchor="middle" opacity="1"><tspan x="820" dy="0">Responsibility change</tspan></text>
<text x="820" y="330" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="650" fill="#d97706" text-anchor="middle" opacity="1"><tspan x="820" dy="0">Control transfer</tspan><tspan x="820" dy="34.56">Handoff</tspan><tspan x="820" dy="34.56">Supervisor</tspan></text>
<text x="820" y="485" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="820" dy="0">Transfer current ownership</tspan><tspan x="820" dy="28.16">Or retain global ownership</tspan><tspan x="820" dy="28.16">Explicit ownership</tspan></text>
<rect x="985" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#2f7d67" stroke-width="3"/><rect x="987" y="204" width="279" height="541" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1125 475)"/>
<rect x="1020" y="235" width="210" height="52" rx="26" fill="#f1f8f5" stroke="#2f7d67" stroke-width="2.4"/><rect x="1022" y="234" width="209" height="53" rx="27" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1125 261)"/><text x="1125" y="269" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="650" fill="#2f7d67" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">Independent subtasks</tspan></text>
<text x="1125" y="330" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="650" fill="#2f7d67" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">Parallel aggregation</tspan><tspan x="1125" dy="34.56">Router</tspan><tspan x="1125" dy="34.56">Fan-Out / Join</tspan></text>
<text x="1125" y="485" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">Shortens the critical path</tspan><tspan x="1125" dy="28.16">Join is the hard part</tspan><tspan x="1125" dy="28.16">Partial-result semantics</tspan></text>
<rect x="1290" y="205" width="240" height="540" rx="22" fill="#ffffff" stroke="#c73e3e" stroke-width="3"/><rect x="1292" y="204" width="239" height="541" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 1410 475)"/>
<rect x="1305" y="235" width="210" height="52" rx="26" fill="#fff3f2" stroke="#c73e3e" stroke-width="2.4"/><rect x="1307" y="234" width="209" height="53" rx="27" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 1410 261)"/><text x="1410" y="269" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="650" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1410" dy="0">Complex organization</tspan></text>
<text x="1410" y="330" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="650" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1410" dy="0">Org meta-patterns</tspan><tspan x="1410" dy="32">Hierarchical</tspan><tspan x="1410" dy="32">Semantic Consensus</tspan></text>
<text x="1410" y="485" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="1410" dy="0">Hierarchy · roll-up</tspan><tspan x="1410" dy="28.16">Evidence independence</tspan><tspan x="1410" dy="28.16">Not a majority vote</tspan></text>
<text x="800" y="812" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="800" dy="0">Use the least dynamic structure that meets constraints; require proven quality, latency, cost, or risk gains.</tspan></text>

