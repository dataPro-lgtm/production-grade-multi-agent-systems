<text x="800" y="760" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23.9" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="800" dy="0">推奨：インシデント一次判定には timeout + partial を使います。1分岐のタイムアウトだけで全体タスクを失敗にしてはいけません。</tspan></text>

