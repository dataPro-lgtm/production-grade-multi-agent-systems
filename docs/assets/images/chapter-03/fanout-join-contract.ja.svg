<text x="1430" y="380" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="26.7" font-weight="720" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1430" dy="0">中間判断</tspan></text>
<text x="1430" y="425" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="1430" dy="0">2/3 完了</tspan><tspan x="1430" dy="28.16">競合を保持</tspan><tspan x="1430" dy="28.16">不足エビデンスを明示</tspan></text>
