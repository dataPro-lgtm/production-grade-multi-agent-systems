<text x="900" y="375" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="start" opacity="1"><tspan x="900" dy="0">待機集合：誰の応答が必須か？</tspan><tspan x="900" dy="29.44">完了しきい値：必須エビデンスは？</tspan><tspan x="900" dy="29.44">期限：タイムアウト時の縮退は？</tspan><tspan x="900" dy="29.44">競合：保持か裁定か？</tspan><tspan x="900" dy="29.44">遅延結果：破棄か改訂か？</tspan></text>
