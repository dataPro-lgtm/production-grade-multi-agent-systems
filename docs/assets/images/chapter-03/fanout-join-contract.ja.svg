<text x="70" y="76" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="760" fill="#173a63" text-anchor="start" opacity="1"><tspan x="70" dy="0">Fan-Out は直感的。信頼できる Join こそ実装上の難所</tspan></text><path d="M 70 94 C 260 88, 470 101, 680 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#526a82" text-anchor="start" opacity="1"><tspan x="72" dy="0">並列化が短縮するのは実行時間だけです。Join Contract が、いつ、どのエビデンスで続行するかを決めます。</tspan></text>
<rect x="70" y="350" width="230" height="150" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/><rect x="72" y="349" width="229" height="151" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 185 425)"/>
