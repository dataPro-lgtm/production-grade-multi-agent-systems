<text x="185" y="452" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="185" dy="0">独立したサブタスクに分割</tspan></text>
