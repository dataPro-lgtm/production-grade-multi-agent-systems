<text x="70" y="76" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="760" fill="#173a63" text-anchor="start" opacity="1"><tspan x="70" dy="0">パターンは選択肢ではなく、5種類の制御構造</tspan></text><path d="M 70 94 C 260 88, 470 101, 680 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#526a82" text-anchor="start" opacity="1"><tspan x="72" dy="0">1つのシステムでパターンを組み合わせられます。各レイヤーで解決する問題を明示します。</tspan></text>
<rect x="70" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#173a63" stroke-width="3"/><rect x="72" y="204" width="279" height="541" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 210 475)"/>
<rect x="105" y="235" width="210" height="52" rx="26" fill="#f3f7fb" stroke="#173a63" stroke-width="2.4"/><rect x="107" y="234" width="209" height="53" rx="27" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 210 261)"/><text x="210" y="269" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="210" dy="0">安定タスク</tspan></text>
<text x="210" y="330" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="210" dy="0">決定論的パイプライン</tspan><tspan x="210" dy="34.56">Sequential</tspan><tspan x="210" dy="34.56">Chain-of-Agents</tspan></text>
<text x="210" y="485" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="210" dy="0">経路はコードで決定</tspan><tspan x="210" dy="28.16">予測可能 · テスト容易</tspan><tspan x="210" dy="28.16">安定した手順向け</tspan></text>
<rect x="375" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#6d4ba0" stroke-width="3"/><rect x="377" y="204" width="279" height="541" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 515 475)"/>
<rect x="410" y="235" width="210" height="52" rx="26" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="2.4"/><rect x="412" y="234" width="209" height="53" rx="27" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 515 261)"/><text x="515" y="269" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="650" fill="#6d4ba0" text-anchor="middle" opacity="1"><tspan x="515" dy="0">探索的な問い</tspan></text>
<text x="515" y="330" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="650" fill="#6d4ba0" text-anchor="middle" opacity="1"><tspan x="515" dy="0">探索と審議</tspan><tspan x="515" dy="34.56">Tree-of-Thoughts</tspan><tspan x="515" dy="34.56">Magentic</tspan></text>
<text x="515" y="485" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="515" dy="0">探索、評価、再計画</tspan><tspan x="515" dy="28.16">幅と深さを制限</tspan><tspan x="515" dy="28.16">目標契約は不変</tspan></text>
<rect x="680" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#d97706" stroke-width="3"/><rect x="682" y="204" width="279" height="541" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 820 475)"/>
<rect x="715" y="235" width="210" height="52" rx="26" fill="#fff8e8" stroke="#d97706" stroke-width="2.4"/><rect x="717" y="234" width="209" height="53" rx="27" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 820 261)"/><text x="820" y="269" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="650" fill="#d97706" text-anchor="middle" opacity="1"><tspan x="820" dy="0">責任の変化</tspan></text>
<text x="820" y="330" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="650" fill="#d97706" text-anchor="middle" opacity="1"><tspan x="820" dy="0">制御権の移行</tspan><tspan x="820" dy="34.56">Handoff</tspan><tspan x="820" dy="34.56">Supervisor</tspan></text>
<text x="820" y="485" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="820" dy="0">現在の責任を移管</tspan><tspan x="820" dy="28.16">または全体責任を保持</tspan><tspan x="820" dy="28.16">オーナーシップを明確に</tspan></text>
<rect x="985" y="205" width="280" height="540" rx="22" fill="#ffffff" stroke="#2f7d67" stroke-width="3"/><rect x="987" y="204" width="279" height="541" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1125 475)"/>
<rect x="1020" y="235" width="210" height="52" rx="26" fill="#f1f8f5" stroke="#2f7d67" stroke-width="2.4"/><rect x="1022" y="234" width="209" height="53" rx="27" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1125 261)"/><text x="1125" y="269" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="650" fill="#2f7d67" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">独立サブタスク</tspan></text>
<text x="1125" y="330" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="650" fill="#2f7d67" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">並列集約</tspan><tspan x="1125" dy="34.56">Router</tspan><tspan x="1125" dy="34.56">Fan-Out / Join</tspan></text>
<text x="1125" y="485" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="1125" dy="0">クリティカルパスを短縮</tspan><tspan x="1125" dy="28.16">難所は Join</tspan><tspan x="1125" dy="28.16">部分結果に意味を持たせる</tspan></text>
<rect x="1290" y="205" width="240" height="540" rx="22" fill="#ffffff" stroke="#c73e3e" stroke-width="3"/><rect x="1292" y="204" width="239" height="541" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 1410 475)"/>
<rect x="1305" y="235" width="210" height="52" rx="26" fill="#fff3f2" stroke="#c73e3e" stroke-width="2.4"/><rect x="1307" y="234" width="209" height="53" rx="27" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 1410 261)"/><text x="1410" y="269" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="650" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1410" dy="0">複雑な組織</tspan></text>
<text x="1410" y="330" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23" font-weight="650" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1410" dy="0">組織とメタパターン</tspan><tspan x="1410" dy="32">Hierarchical</tspan><tspan x="1410" dy="32">Semantic Consensus</tspan></text>
<text x="1410" y="485" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="1410" dy="0">階層チームと集約</tspan><tspan x="1410" dy="28.16">エビデンスの独立性を優先</tspan><tspan x="1410" dy="28.16">単純な多数決ではない</tspan></text>
<text x="800" y="812" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="23" font-weight="650" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="800" dy="0">選択原則：制約を満たす最小限の動的構造を使います。新パターンは品質、レイテンシ、コスト、リスクの改善で正当化します。</tspan></text>

