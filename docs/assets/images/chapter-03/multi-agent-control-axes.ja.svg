<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" focusable="false" data-whiteboard-version="3" lang="ja">
<title id="whiteboard-title">マルチエージェント構成では、まず5つの制御問題に答える</title>
<desc id="whiteboard-desc">『プロダクショングレード・マルチエージェントシステム』第03章のアーキテクチャ図。決定論的なホワイトボード図で、制御フロー、エビデンス、責任境界を示します。</desc>

<defs><pattern id="whiteboard-paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="3" r=".7" fill="#d7dee7" opacity=".34"/>
  <circle cx="13" cy="11" r=".45" fill="#eadfce" opacity=".3"/>
</pattern><marker id="arrow-1e3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#173a63"/></marker><marker id="arrow-d59621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker><marker id="arrow-3c8d77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d67"/></marker><marker id="arrow-c94c4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c73e3e"/></marker><marker id="arrow-7651a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d4ba0"/></marker><marker id="arrow-55708f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526a82"/></marker><filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter></defs>
<rect width="1600" height="900" fill="#fffdf9"/>
<g id="whiteboard-surface" aria-hidden="true" opacity=".22">
  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M 20 180 C 420 171, 920 190, 1580 177 M 30 718 C 530 727, 980 707, 1570 721" stroke="#e7dfce" stroke-width="2" fill="none" opacity=".52"/>

<text x="70" y="76" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="760" fill="#173a63" text-anchor="start" opacity="1"><tspan x="70" dy="0">マルチエージェント構成では、まず5つの制御問題に答える</tspan></text><path d="M 70 94 C 260 88, 470 101, 680 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#526a82" text-anchor="start" opacity="1"><tspan x="72" dy="0">パターン名は表層にすぎず、システムの振る舞いを決めるのは制御と責任です。</tspan></text>
<rect x="585" y="325" width="430" height="200" rx="90" fill="#ffffff" stroke="#173a63" stroke-width="4"/><rect x="587" y="324" width="429" height="201" rx="91" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 425)"/>
<text x="800" y="395" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="41.4" font-weight="760" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="800" dy="0">マルチエージェント</tspan></text>
<text x="800" y="446" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="800" dy="0">分散制御システム</tspan></text>
<text x="800" y="490" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="650" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="800" dy="0">「モデルを増やす」ことではない</tspan></text>
<rect x="90" y="235" width="310" height="150" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/><rect x="92" y="234" width="309" height="151" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".32" transform="rotate(.18 245 310)"/>
<text x="245" y="285" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="720" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="245" dy="0">① 制御権</tspan></text>
<text x="245" y="328" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="245" dy="0">次の一手を誰が決めるか？</tspan></text>
<rect x="1200" y="235" width="310" height="150" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/><rect x="1202" y="234" width="309" height="151" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 1355 310)"/>
<text x="1355" y="285" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="720" fill="#d97706" text-anchor="middle" opacity="1"><tspan x="1355" dy="0">② オーナーシップ</tspan></text>
<text x="1355" y="328" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="1355" dy="0">結果の責任者は誰か？</tspan></text>
<rect x="80" y="570" width="320" height="150" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/><rect x="82" y="569" width="319" height="151" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 240 645)"/>
<text x="240" y="620" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="720" fill="#2f7d67" text-anchor="middle" opacity="1"><tspan x="240" dy="0">③ トポロジー</tspan></text>
<text x="240" y="663" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="240" dy="0">情報と制御はどう流れるか？</tspan></text>
<rect x="640" y="625" width="320" height="150" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="3"/><rect x="642" y="624" width="319" height="151" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 800 700)"/>
<text x="800" y="675" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="720" fill="#6d4ba0" text-anchor="middle" opacity="1"><tspan x="800" dy="0">④ 境界</tspan></text>
<text x="800" y="718" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="800" dy="0">なぜ分離が必要か？</tspan></text>
<rect x="1200" y="570" width="310" height="150" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="3"/><rect x="1202" y="569" width="309" height="151" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 1355 645)"/>
<text x="1355" y="620" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="28.5" font-weight="720" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1355" dy="0">⑤ 収束</tspan></text>
<text x="1355" y="663" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="middle" opacity="1"><tspan x="1355" dy="0">完了または停止をどう判断するか？</tspan></text>
<path d="M 400 310 C 461.6666666666667 308, 523.3333333333334 387, 585 385" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1e3a5f)" opacity="1"/>
<path d="M 1200 310 C 1138.3333333333333 308, 1076.6666666666667 387, 1015 385" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)" opacity="1"/>
<path d="M 400 620 C 466.6666666666667 618, 533.3333333333334 502, 600 500" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)" opacity="1"/>
<path d="M 800 625 C 800 623, 800 527, 800 525" fill="none" stroke="#6d4ba0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7651a6)" opacity="1"/>
<path d="M 1200 620 C 1133.3333333333333 618, 1066.6666666666667 502, 1000 500" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)" opacity="1"/>
<text x="77" y="805" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="22.1" font-weight="500" fill="#526a82" text-anchor="start" opacity="1"><tspan x="77" dy="0">障害セマンティクスは5つすべてに関わります。誰が処理し、責任を負い、どこまで伝播し、隔離できるか、いつ停止するかです。</tspan></text>

<text id="whiteboard-footer" x="1525" y="862" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16.6" fill="#526a82" text-anchor="end">プロダクショングレード・マルチエージェントシステム · 第03章</text>
