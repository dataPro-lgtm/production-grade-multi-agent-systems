<text x="70" y="82" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="800" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">Release Gates: sequential risk reduction, not cumulative scoring</tspan></text><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">Performance, documentation, and features cannot offset cross-tenant leakage, unknown side effects, or unrecoverable state.</tspan></text><path d="M 70 160 C 556.6666666666666 158, 1043.3333333333333 162, 1530 160" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/>
