<text x="800" y="670" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">Conditions must specify Scope, Owner, Due Date, and Verifier</tspan></text>
<text x="800" y="810" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="23.8" font-weight="760" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">A later Gate cannot supply missing evidence for an earlier one; material changes require a new RC.</tspan></text>
