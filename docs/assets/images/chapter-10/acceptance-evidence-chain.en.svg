<rect width="1600" height="900" fill="#38516d" filter="url(#paper)" opacity=".16"/>
<text x="70" y="82" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="800" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">Acceptance evidence chain: from Requirement to Sign-off</tspan></text><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">If one node is missing, the system Claim can only be downgraded to an assumption.</tspan></text><path d="M 70 160 C 556.6666666666666 158, 1043.3333333333333 162, 1530 160" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/>
<rect x="40" y="300" width="180" height="155" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/><rect x="42" y="299" width="179" height="156" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".28" transform="rotate(.18 130 377.5)"/><text x="130" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#173a63" text-anchor="middle"><tspan x="130" dy="0">Requirement</tspan></text><text x="130" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="130" dy="0">What must be proven</tspan></text><path d="M 220 377 C 231.66666666666666 375, 243.33333333333334 379, 255 377" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1e3a5f)"/><rect x="260" y="300" width="180" height="155" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="3"/><rect x="262" y="299" width="179" height="156" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".28" transform="rotate(.18 350 377.5)"/><text x="350" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#6d4ba0" text-anchor="middle"><tspan x="350" dy="0">ADR</tspan></text><text x="350" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="350" dy="0">Why this design</tspan></text><path d="M 440 377 C 451.6666666666667 375, 463.3333333333333 379, 475 377" fill="none" stroke="#6d4ba0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-7651a6)"/><rect x="480" y="300" width="180" height="155" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/><rect x="482" y="299" width="179" height="156" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".28" transform="rotate(.18 570 377.5)"/><text x="570" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#2f7d67" text-anchor="middle"><tspan x="570" dy="0">Contract</tspan></text><text x="570" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="570" dy="0">Boundaries must hold</tspan></text><path d="M 660 377 C 671.6666666666666 375, 683.3333333333334 379, 695 377" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)"/><rect x="700" y="300" width="180" height="155" rx="22" fill="#ffffff" stroke="#173a63" stroke-width="3"/><rect x="702" y="299" width="179" height="156" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".28" transform="rotate(.18 790 377.5)"/><text x="790" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#173a63" text-anchor="middle"><tspan x="790" dy="0">Implementation</tspan></text><text x="790" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="790" dy="0">Which version implements it?</tspan></text><path d="M 880 377 C 891.6666666666666 375, 903.3333333333334 379, 915 377" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1e3a5f)"/><rect x="920" y="300" width="180" height="155" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/><rect x="922" y="299" width="179" height="156" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".28" transform="rotate(.18 1010 377.5)"/><text x="1010" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#d97706" text-anchor="middle"><tspan x="1010" dy="0">Test / Eval</tspan></text><text x="1010" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="1010" dy="0">How to verify</tspan></text><path d="M 1100 377 C 1111.6666666666667 375, 1123.3333333333333 379, 1135 377" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)"/><rect x="1140" y="300" width="180" height="155" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="3"/><rect x="1142" y="299" width="179" height="156" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".28" transform="rotate(.18 1230 377.5)"/><text x="1230" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#c73e3e" text-anchor="middle"><tspan x="1230" dy="0">Runtime</tspan></text><text x="1230" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="1230" dy="0">Production evidence</tspan></text><path d="M 1320 377 C 1331.6666666666667 375, 1343.3333333333333 379, 1355 377" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)"/><rect x="1360" y="300" width="180" height="155" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/><rect x="1362" y="299" width="179" height="156" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".28" transform="rotate(.18 1450 377.5)"/><text x="1450" y="353" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="800" fill="#2f7d67" text-anchor="middle"><tspan x="1450" dy="0">Sign-off</tspan></text><text x="1450" y="402" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="1450" dy="0">Who owns the decision?</tspan></text>
<rect x="100" y="560" width="1400" height="145" rx="34" fill="#ffffff" stroke="#d97706" stroke-width="3" stroke-dasharray="12 9"/><rect x="102" y="559" width="1399" height="146" rx="35" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".28" transform="rotate(.18 800 632.5)"/>
<text x="150" y="612" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="800" fill="#d97706" text-anchor="start"><tspan x="150" dy="0">Change impact</tspan></text>
<text x="360" y="612" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="360" dy="0">Requirement change → Contract / tests / metrics</tspan></text>
<text x="800" y="612" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="800" dy="0">Contract Major → Consumer review</tspan></text>
<text x="1170" y="612" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18" font-weight="700" fill="#173a63" text-anchor="start"><tspan x="1170" dy="0">Production anomaly → user commitment</tspan></text>
<text x="800" y="666" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">A Traceability Matrix is not a document index, but a queryable set of bidirectional relationships.</tspan></text>
<text x="800" y="810" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="23" font-weight="760" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Only the current RC&apos;s tests, Trace, Artifact, and sign-off can support its Claim.</tspan></text>
