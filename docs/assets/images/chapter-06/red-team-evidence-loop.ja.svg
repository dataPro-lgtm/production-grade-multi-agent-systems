<text x="800" y="650" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="20.2" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">検出事項を修正 → 回帰セットに追加 → 再実行 → エビデンスを保存</tspan></text>
<text x="800" y="760" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="25.8" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">テストセットのASR = 0が証明するのは、現バージョンと現サンプルに対してのみです。未知の攻撃リスクは残ります。</tspan></text>

