<text x="800" y="635" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="500" fill="#526a82" text-anchor="middle"><tspan x="800" dy="0">生のセッションを削除した後も、要約、長期Memory、ベクトルインデックス、Artifact、評価セット、バックアップの期限切れをすべて処理する必要があります。</tspan></text>
<text x="800" y="760" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="25.8" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Encryptionは転送中と保存時のデータを保護しますが、復号後にモデルへ入る機密コンテンツは減らしません。</tspan></text>

