<text x="620" y="385" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="620" dy="0">Audienceを検証</tspan><tspan x="620" dy="35.65">Scope / Tool Policy</tspan><tspan x="620" dy="35.65">Client Tokenをそのまま転送しない</tspan><tspan x="620" dy="35.65">独立した上流認証情報</tspan></text>
<rect x="515" y="545" width="210" height="52" rx="26" fill="#ffffff" stroke="#c73e3e" stroke-width="2.4"/><rect x="517" y="544" width="209" height="53" rx="27" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 620 571)"/><text x="620" y="579" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="620" dy="0">Tool Guard</tspan></text>
<rect x="875" y="255" width="310" height="380" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="3"/><rect x="877" y="254" width="309" height="381" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 1030 445)"/>
