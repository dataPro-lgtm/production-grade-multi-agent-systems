<rect x="465" y="255" width="310" height="380" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/><rect x="467" y="254" width="309" height="381" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".32" transform="rotate(.18 620 445)"/>
