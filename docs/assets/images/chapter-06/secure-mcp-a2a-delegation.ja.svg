<text x="70" y="76" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="39.6" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">MCPとA2A：アイデンティティ確立後も業務権限を再計算する</tspan></text><path d="M 70 94 C 265 87, 485 102, 710 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">TokenをAudienceにバインドし、委任はホップごとに縮小します。トランスポート上のアイデンティティも能力記述も、リソース認可の代替にはなりません。</tspan></text>
