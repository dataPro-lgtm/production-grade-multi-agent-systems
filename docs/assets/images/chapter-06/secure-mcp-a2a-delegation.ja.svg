<text x="800" y="720" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="24.8" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="800" dy="0">AgentCard / Tool Descriptionは能力を記述するだけで、権限は付与しません。受信側は操作ごとに検証する必要があります。</tspan></text>
