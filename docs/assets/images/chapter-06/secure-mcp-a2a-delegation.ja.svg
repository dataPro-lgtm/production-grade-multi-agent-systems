<text x="210" y="385" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="210" dy="0">ユーザー委任</tspan><tspan x="210" dy="35.65">Task Scope</tspan><tspan x="210" dy="35.65">Deadline</tspan><tspan x="210" dy="35.65">Risk Ceiling</tspan></text>
