<rect x="925" y="545" width="210" height="52" rx="26" fill="#ffffff" stroke="#6d4ba0" stroke-width="2.4"/><rect x="927" y="544" width="209" height="53" rx="27" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".32" transform="rotate(.18 1030 571)"/><text x="1030" y="579" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="19.3" font-weight="700" fill="#6d4ba0" text-anchor="middle"><tspan x="1030" dy="0">Scopeは縮小のみ</tspan></text>
<rect x="1285" y="255" width="270" height="380" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/><rect x="1287" y="254" width="269" height="381" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".32" transform="rotate(.18 1420 445)"/>
<text x="1420" y="315" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="27.6" font-weight="760" fill="#2f7d67" text-anchor="middle"><tspan x="1420" dy="0">リソース / API</tspan></text>
<text x="1420" y="385" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="21.2" font-weight="500" fill="#173a63" text-anchor="middle"><tspan x="1420" dy="0">独立したアイデンティティ</tspan><tspan x="1420" dy="35.65">リソース単位の認可</tspan><tspan x="1420" dy="35.65">フィールド最小化</tspan><tspan x="1420" dy="35.65">完全なAudit</tspan></text>
