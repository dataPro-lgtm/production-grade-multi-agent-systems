<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" focusable="false" data-whiteboard-version="3" lang="en">
<title id="whiteboard-title">Layered multi-agent system: narrow the decision space layer by layer</title>
<desc id="whiteboard-desc">Chapter 07 architecture diagram for Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow, evidence, or responsibility boundaries.</desc>

<defs><pattern id="whiteboard-paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="3" r=".7" fill="#d7dee7" opacity=".34"/>
  <circle cx="13" cy="11" r=".45" fill="#eadfce" opacity=".3"/>
