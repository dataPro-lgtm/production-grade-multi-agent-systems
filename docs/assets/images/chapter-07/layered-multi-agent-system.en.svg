  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M 20 180 C 420 171, 920 190, 1580 177 M 30 718 C 530 727, 980 707, 1570 721" stroke="#e7dfce" stroke-width="2" fill="none" opacity=".52"/>

<text x="70" y="76" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">Layered multi-agent system: narrow the decision space layer by layer</tspan></text><path d="M 70 94 C 265 87, 485 102, 710 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">Each layer receives only the goals, context, permissions, and budget needed for its responsibility.</tspan></text>
<rect x="80" y="220" width="1440" height="82" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="3"/><rect x="82" y="219" width="1439" height="83" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".3" transform="rotate(.18 800 261)"/>
<rect x="105" y="236" width="230" height="50" rx="25" fill="#ffffff" stroke="#c73e3e" stroke-width="2.4"/><rect x="107" y="235" width="229" height="51" rx="26" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".3" transform="rotate(.18 220 261)"/><text x="220" y="269" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="19.7" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="220" dy="0">Access / API</tspan></text>
<text x="400" y="272" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="650" fill="#173a63" text-anchor="start"><tspan x="400" dy="0">User identity · Session · Input gate · Response protocol</tspan></text>
<text x="1450" y="271" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="17.2" font-weight="700" fill="#c73e3e" text-anchor="end"><tspan x="1450" dy="0">No business planning</tspan></text>
<path d="M 800 302 C 800 300, 800 337, 800 335" fill="none" stroke="#c73e3e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-c94c4c)"/>
<rect x="140" y="335" width="1320" height="82" rx="22" fill="#f3f7fb" stroke="#173a63" stroke-width="3"/><rect x="142" y="334" width="1319" height="83" rx="23" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".3" transform="rotate(.18 800 376)"/>
<rect x="165" y="351" width="270" height="50" rx="25" fill="#ffffff" stroke="#173a63" stroke-width="2.4"/><rect x="167" y="350" width="269" height="51" rx="26" fill="none" stroke="#173a63" stroke-width="1.2" opacity=".3" transform="rotate(.18 300 376)"/><text x="300" y="384" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#173a63" text-anchor="middle"><tspan x="300" dy="0">Central Supervisor</tspan></text>
<text x="500" y="387" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="650" fill="#173a63" text-anchor="start"><tspan x="500" dy="0">Cross-domain goal · Team routing · Global dependencies · Join</tspan></text>
<text x="1390" y="386" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="17.2" font-weight="700" fill="#c73e3e" text-anchor="end"><tspan x="1390" dy="0">No access to business databases</tspan></text>
<path d="M 800 417 C 800 415, 800 452, 800 450" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-1e3a5f)"/>
<rect x="200" y="450" width="1200" height="82" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="3"/><rect x="202" y="449" width="1199" height="83" rx="23" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".3" transform="rotate(.18 800 491)"/>
<rect x="225" y="466" width="270" height="50" rx="25" fill="#ffffff" stroke="#d97706" stroke-width="2.4"/><rect x="227" y="465" width="269" height="51" rx="26" fill="none" stroke="#d97706" stroke-width="1.2" opacity=".3" transform="rotate(.18 360 491)"/><text x="360" y="499" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#d97706" text-anchor="middle"><tspan x="360" dy="0">Team Supervisors</tspan></text>
<text x="560" y="502" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="650" fill="#173a63" text-anchor="start"><tspan x="560" dy="0">Domain-local plan · Worker routing · Sub-budget · Local aggregation</tspan></text>
<text x="1330" y="501" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="17.2" font-weight="700" fill="#c73e3e" text-anchor="end"><tspan x="1330" dy="0">Do not override global permissions</tspan></text>
<path d="M 800 532 C 800 530, 800 567, 800 565" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-d59621)"/>
<rect x="260" y="565" width="1080" height="82" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="3"/><rect x="262" y="564" width="1079" height="83" rx="23" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".3" transform="rotate(.18 800 606)"/>
<rect x="285" y="581" width="210" height="50" rx="25" fill="#ffffff" stroke="#2f7d67" stroke-width="2.4"/><rect x="287" y="580" width="209" height="51" rx="26" fill="none" stroke="#2f7d67" stroke-width="1.2" opacity=".3" transform="rotate(.18 390 606)"/><text x="390" y="614" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#2f7d67" text-anchor="middle"><tspan x="390" dy="0">Workers</tspan></text>
<text x="560" y="617" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="20.5" font-weight="650" fill="#173a63" text-anchor="start"><tspan x="560" dy="0">Single capability · Evidence-backed result · Explicit errors</tspan></text>
<text x="1270" y="616" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="17.2" font-weight="700" fill="#c73e3e" text-anchor="end"><tspan x="1270" dy="0">No free-form tool exploration</tspan></text>
<path d="M 800 647 C 800 645, 800 682, 800 680" fill="none" stroke="#2f7d67" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-3c8d77)"/>
<rect x="320" y="680" width="960" height="82" rx="22" fill="#ffffff" stroke="#6d4ba0" stroke-width="3"/><rect x="322" y="679" width="959" height="83" rx="23" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".3" transform="rotate(.18 800 721)"/>
<rect x="345" y="696" width="240" height="50" rx="25" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="2.4"/><rect x="347" y="695" width="239" height="51" rx="26" fill="none" stroke="#6d4ba0" stroke-width="1.2" opacity=".3" transform="rotate(.18 465 721)"/><text x="465" y="729" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="700" fill="#6d4ba0" text-anchor="middle"><tspan x="465" dy="0">Tools / Data</tspan></text>
<text x="650" y="732" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="650" fill="#173a63" text-anchor="start"><tspan x="650" dy="0">Execution · Authorization · Idempotency · Schema</tspan></text>
<text x="1210" y="731" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="17.2" font-weight="700" fill="#c73e3e" text-anchor="end"><tspan x="1210" dy="0">Do not interpret open-ended goals</tspan></text>
<text x="800" y="815" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="700" fill="#c73e3e" text-anchor="middle"><tspan x="800" dy="0">Hierarchy adds value only when permissions, context, and blast radius shrink at every lower layer.</tspan></text>

