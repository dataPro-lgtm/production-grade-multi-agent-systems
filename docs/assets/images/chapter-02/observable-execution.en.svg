  <path d="M1422 590 C1400 640 1300 660 1250 690" class="flow"/>

  <text x="800" y="858" text-anchor="middle" class="label box-title">Redact parameters and results first; stable IDs make models, policies, tools, evidence, and answers mutually traceable</text>
