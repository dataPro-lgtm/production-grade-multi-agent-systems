<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" aria-labelledby="title desc" role="img" focusable="false" data-whiteboard-version="3" lang="en">
<title id="whiteboard-title">Observability must reconstruct the process, not merely save the answer</title>
<desc id="whiteboard-desc">Chapter 02 architecture diagrams from Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow, evidence, and responsibility boundaries.</desc>

<title id="title">Observability chain from Thread to Trace, Run, and Evidence</title>
  <desc id="desc">A Thread contains multiple Traces; each Trace contains model, policy, tool, and validation Runs linked to evidence and the final answer.</desc>
  <defs><pattern id="whiteboard-paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="3" r=".7" fill="#d7dee7" opacity=".34"/>
  <circle cx="13" cy="11" r=".45" fill="#eadfce" opacity=".3"/>
</pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="37" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#173a63" stroke-width="2.2"/></marker>
    <style>.label{font-family:'Chalkboard SE','Comic Sans MS','Arial',sans-serif;fill:#24364b}.title{font-size:34.4px;font-weight:700}.box-title{font-size:22.1px;font-weight:700}.body{font-size:16.4px}.small{font-size:14.8px}.flow{fill:none;stroke:#173a63;stroke-width:4;marker-end:url(#arrow)}.link{fill:none;stroke:#6d4ba0;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf9"/>
<g id="whiteboard-surface" aria-hidden="true" opacity=".22">
  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

