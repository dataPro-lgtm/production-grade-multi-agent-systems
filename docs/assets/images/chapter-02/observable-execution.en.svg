    <rect x="930" y="690" width="430" height="110" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="5"/>
  </g>

  <text x="800" y="165" text-anchor="middle" class="label box-title">Thread: cross-turn task state</text><text x="800" y="198" text-anchor="middle" class="label small">thread_id · User · Conversation lifecycle</text>
  <text x="800" y="310" text-anchor="middle" class="label box-title">Trace: one user goal</text><text x="800" y="343" text-anchor="middle" class="label small">trace_id · Prompt / Tool / Dataset versions</text>

  <text x="182" y="495" text-anchor="middle" class="label box-title">Model Run</text><text x="182" y="535" text-anchor="middle" class="label body">Tool selection</text><text x="182" y="566" text-anchor="middle" class="label small">Token · Latency</text>
  <text x="492" y="495" text-anchor="middle" class="label box-title">Policy Run</text><text x="492" y="535" text-anchor="middle" class="label body">Authorization and risk</text><text x="492" y="566" text-anchor="middle" class="label small">Rule version · Reason</text>
  <text x="802" y="495" text-anchor="middle" class="label box-title">Tool Run</text><text x="802" y="535" text-anchor="middle" class="label body">Parameters and results</text><text x="802" y="566" text-anchor="middle" class="label small">call_id · Latency</text>
  <text x="1112" y="495" text-anchor="middle" class="label box-title">Model Run</text><text x="1112" y="535" text-anchor="middle" class="label body">Evidence interpretation</text><text x="1112" y="566" text-anchor="middle" class="label small">Decision · Answer</text>
  <text x="1422" y="495" text-anchor="middle" class="label box-title">Validation Run</text><text x="1422" y="535" text-anchor="middle" class="label body">Evidence and safety</text><text x="1422" y="566" text-anchor="middle" class="label small">Coverage · Score</text>

  <text x="455" y="735" text-anchor="middle" class="label box-title">Evidence</text><text x="455" y="772" text-anchor="middle" class="label body">Source · Freshness · Quality · evidence_id</text>
  <text x="1145" y="735" text-anchor="middle" class="label box-title">Final answer / Termination reason</text><text x="1145" y="772" text-anchor="middle" class="label body">Cite evidence, or explicitly fail, refuse, or hand off to a human</text>

