  <text x="80" y="72" class="label title">Observability must reconstruct the process, not merely save the answer</text>

  <g filter="url(#rough)">
    <rect x="580" y="125" width="440" height="92" rx="20" fill="#fff8e8" stroke="#d97706" stroke-width="5"/>
    <rect x="580" y="270" width="440" height="92" rx="20" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="5"/>
