<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" aria-labelledby="title desc" role="img" focusable="false" data-whiteboard-version="3" lang="en">
<title id="whiteboard-title">Tool Calling: from action proposal to controlled execution</title>
<desc id="whiteboard-desc">Chapter 02 architecture diagrams from Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow, evidence, and responsibility boundaries.</desc>

<title id="title">Controlled-execution responsibility chain for Tool Calling</title>
  <desc id="desc">A user goal moves through model action proposal, protocol parsing, parameter and policy validation, deterministic execution, and result writeback to produce an evidence-backed answer.</desc>
  <defs><pattern id="whiteboard-paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="3" r=".7" fill="#d7dee7" opacity=".34"/>
  <circle cx="13" cy="11" r=".45" fill="#eadfce" opacity=".3"/>
</pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#173a63" stroke-width="2.2"/>
    </marker>
    <style>
      .label{font-family:'Chalkboard SE','Comic Sans MS','Arial',sans-serif;fill:#24364b}
      .title{font-size:34.4px;font-weight:700}.box-title{font-size:22.1px;font-weight:700}.body{font-size:16.4px}.small{font-size:14.8px}
      .flow{fill:none;stroke:#173a63;stroke-width:4.5;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf9"/>
<g id="whiteboard-surface" aria-hidden="true" opacity=".22">
  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M55 92 C380 66 680 82 970 66 C1210 54 1400 70 1545 58" stroke="#d7d2c8" stroke-width="3" fill="none"/>
  <text x="80" y="72" class="label title">Tool Calling: from action proposal to controlled execution</text>

  <g filter="url(#rough)">
    <rect x="55" y="270" width="170" height="150" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="5"/>
    <rect x="265" y="270" width="180" height="150" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="5"/>
    <rect x="485" y="270" width="180" height="150" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="5"/>
    <rect x="705" y="270" width="190" height="150" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="5"/>
    <rect x="935" y="270" width="180" height="150" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="5"/>
    <rect x="1155" y="270" width="180" height="150" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="5"/>
    <rect x="1375" y="270" width="170" height="150" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="5"/>
  </g>

  <text x="140" y="325" text-anchor="middle" class="label box-title">User goal</text>
  <text x="140" y="365" text-anchor="middle" class="label body">Goal</text>
  <text x="140" y="397" text-anchor="middle" class="label small">Scope · Constraints</text>

  <text x="355" y="325" text-anchor="middle" class="label box-title">Model decision</text>
  <text x="355" y="365" text-anchor="middle" class="label body">Choose next step</text>
  <text x="355" y="397" text-anchor="middle" class="label small">Does not execute directly</text>

  <text x="575" y="325" text-anchor="middle" class="label box-title">Tool Call</text>
  <text x="575" y="365" text-anchor="middle" class="label body">Name · Parameters</text>
  <text x="575" y="397" text-anchor="middle" class="label small">Action proposal</text>

  <text x="800" y="325" text-anchor="middle" class="label box-title">Policy gate</text>
  <text x="800" y="365" text-anchor="middle" class="label body">Schema · Permissions</text>
  <text x="800" y="397" text-anchor="middle" class="label small">Risk · Budget · Approval</text>

  <text x="1025" y="325" text-anchor="middle" class="label box-title">Executor</text>
  <text x="1025" y="365" text-anchor="middle" class="label body">Local · API</text>
  <text x="1025" y="397" text-anchor="middle" class="label small">Database · MCP</text>

  <text x="1245" y="325" text-anchor="middle" class="label box-title">Tool Result</text>
  <text x="1245" y="365" text-anchor="middle" class="label body">Facts · Errors</text>
  <text x="1245" y="397" text-anchor="middle" class="label small">Link call_id</text>

  <text x="1460" y="325" text-anchor="middle" class="label box-title">State update</text>
  <text x="1460" y="365" text-anchor="middle" class="label body">Evidence · Trace</text>
  <text x="1460" y="397" text-anchor="middle" class="label small">Continue or terminate</text>

  <path d="M225 345 L265 345" class="flow"/><path d="M445 345 L485 345" class="flow"/>
  <path d="M665 345 L705 345" class="flow"/><path d="M895 345 L935 345" class="flow"/>
  <path d="M1115 345 L1155 345" class="flow"/><path d="M1335 345 L1375 345" class="flow"/>

  <g filter="url(#rough)">
    <rect x="250" y="540" width="500" height="120" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="4"/>
    <rect x="850" y="540" width="500" height="120" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="4"/>
    <rect x="420" y="720" width="760" height="96" rx="20" fill="#fff3f2" stroke="#c73e3e" stroke-width="4"/>
  </g>
  <text x="500" y="585" text-anchor="middle" class="label box-title">Model plane: handles ambiguous judgment</text>
  <text x="500" y="625" text-anchor="middle" class="label body">Understand goal · Choose candidate actions · Explain evidence</text>
  <text x="1100" y="585" text-anchor="middle" class="label box-title">Control plane: owns execution consequences</text>
  <text x="1100" y="625" text-anchor="middle" class="label body">Authorization · Validation · Idempotency · Audit · Actual call</text>
  <text x="800" y="778" text-anchor="middle" class="label box-title" fill="#9d3030">A Tool Call is an action proposal, not execution permission</text>
<text id="whiteboard-footer" x="1525" y="862" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="14.8" fill="#526a82" text-anchor="end">Production-Grade Multi-Agent Systems · Chapter 02</text>
</svg>
