<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" aria-labelledby="title desc" role="img" focusable="false" data-whiteboard-version="3" lang="ja">
<title id="whiteboard-title">ツール呼び出し：アクション提案から制御された実行まで</title>
<desc id="whiteboard-desc">『プロダクショングレード・マルチエージェントシステム』第 02 章のアーキテクチャ図。決定論的なホワイトボードのワイヤーフレームで、制御フロー、エビデンス、責任境界を示します。</desc>

<title id="title">ツール呼び出しの制御された実行責任チェーン</title>
  <desc id="desc">ユーザー目標は、モデルによるアクション提案、プロトコル解析、パラメータとポリシーの検証、決定論的実行、結果の書き戻しを経て、エビデンスに基づく回答になります。</desc>
  <defs><pattern id="whiteboard-paper-dots" width="17" height="17" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="3" r=".7" fill="#d7dee7" opacity=".34"/>
  <circle cx="13" cy="11" r=".45" fill="#eadfce" opacity=".3"/>
</pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#173a63" stroke-width="2.2"/>
    </marker>
    <style>
      .label{font-family:'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;fill:#24364b}
      .title{font-size:38.6px;font-weight:700}.box-title{font-size:24.8px;font-weight:700}.body{font-size:18.4px}.small{font-size:16.6px}
      .flow{fill:none;stroke:#173a63;stroke-width:4.5;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffdf9"/>
<g id="whiteboard-surface" aria-hidden="true" opacity=".22">
  <rect width="1600" height="900" fill="url(#whiteboard-paper-dots)"/>
</g>

<path d="M55 92 C380 66 680 82 970 66 C1210 54 1400 70 1545 58" stroke="#d7d2c8" stroke-width="3" fill="none"/>
  <text x="80" y="72" class="label title">ツール呼び出し：アクション提案から制御された実行まで</text>

  <g filter="url(#rough)">
    <rect x="55" y="270" width="170" height="150" rx="22" fill="#fff8e8" stroke="#d97706" stroke-width="5"/>
    <rect x="265" y="270" width="180" height="150" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="5"/>
    <rect x="485" y="270" width="180" height="150" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="5"/>
    <rect x="705" y="270" width="190" height="150" rx="22" fill="#fff3f2" stroke="#c73e3e" stroke-width="5"/>
    <rect x="935" y="270" width="180" height="150" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="5"/>
    <rect x="1155" y="270" width="180" height="150" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="5"/>
    <rect x="1375" y="270" width="170" height="150" rx="22" fill="#f7f3fb" stroke="#6d4ba0" stroke-width="5"/>
  </g>

  <text x="140" y="325" text-anchor="middle" class="label box-title">ユーザー目標</text>
  <text x="140" y="365" text-anchor="middle" class="label body">Goal</text>
  <text x="140" y="397" text-anchor="middle" class="label small">スコープ · 制約</text>

  <text x="355" y="325" text-anchor="middle" class="label box-title">モデル判断</text>
  <text x="355" y="365" text-anchor="middle" class="label body">次のステップを選択</text>
  <text x="355" y="397" text-anchor="middle" class="label small">直接実行しない</text>

  <text x="575" y="325" text-anchor="middle" class="label box-title">Tool Call</text>
  <text x="575" y="365" text-anchor="middle" class="label body">名前 · パラメータ</text>
  <text x="575" y="397" text-anchor="middle" class="label small">アクション提案</text>

  <text x="800" y="325" text-anchor="middle" class="label box-title">ポリシーゲート</text>
  <text x="800" y="365" text-anchor="middle" class="label body">Schema · 権限</text>
  <text x="800" y="397" text-anchor="middle" class="label small">リスク · 予算 · 承認</text>

  <text x="1025" y="325" text-anchor="middle" class="label box-title">実行器</text>
  <text x="1025" y="365" text-anchor="middle" class="label body">ローカル · API</text>
  <text x="1025" y="397" text-anchor="middle" class="label small">データベース · MCP</text>

  <text x="1245" y="325" text-anchor="middle" class="label box-title">Tool Result</text>
  <text x="1245" y="365" text-anchor="middle" class="label body">事実 · エラー</text>
  <text x="1245" y="397" text-anchor="middle" class="label small">call_id を関連付ける</text>

  <text x="1460" y="325" text-anchor="middle" class="label box-title">状態更新</text>
  <text x="1460" y="365" text-anchor="middle" class="label body">エビデンス · Trace</text>
  <text x="1460" y="397" text-anchor="middle" class="label small">続行または終了</text>

  <path d="M225 345 L265 345" class="flow"/><path d="M445 345 L485 345" class="flow"/>
  <path d="M665 345 L705 345" class="flow"/><path d="M895 345 L935 345" class="flow"/>
  <path d="M1115 345 L1155 345" class="flow"/><path d="M1335 345 L1375 345" class="flow"/>

  <g filter="url(#rough)">
    <rect x="250" y="540" width="500" height="120" rx="22" fill="#f3f7fb" stroke="#326da8" stroke-width="4"/>
    <rect x="850" y="540" width="500" height="120" rx="22" fill="#f1f8f5" stroke="#2f7d67" stroke-width="4"/>
    <rect x="420" y="720" width="760" height="96" rx="20" fill="#fff3f2" stroke="#c73e3e" stroke-width="4"/>
  </g>
  <text x="500" y="585" text-anchor="middle" class="label box-title">モデルプレーン：曖昧な判断を処理</text>
  <text x="500" y="625" text-anchor="middle" class="label body">目標を理解 · 候補アクションを選択 · エビデンスを説明</text>
  <text x="1100" y="585" text-anchor="middle" class="label box-title">コントロールプレーン：実行の結果責任を負う</text>
  <text x="1100" y="625" text-anchor="middle" class="label body">認可 · 検証 · 冪等性 · 監査 · 実呼び出し</text>
  <text x="800" y="778" text-anchor="middle" class="label box-title" fill="#9d3030">Tool Call はアクション提案であり、実行許可ではない</text>
<text id="whiteboard-footer" x="1525" y="862" font-family="'Klee One','Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif" font-size="16.6" fill="#526a82" text-anchor="end">プロダクショングレード・マルチエージェントシステム · 第 02 章</text>
</svg>
