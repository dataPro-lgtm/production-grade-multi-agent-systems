<title id="whiteboard-title">Four levels of correctness: from parseable to decision-ready</title>
<desc id="whiteboard-desc">Chapter 08 architecture diagram for Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow, evidence, or responsibility boundaries.</desc>

