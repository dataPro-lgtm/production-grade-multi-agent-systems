<text x="70" y="76" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="35.3" font-weight="760" fill="#173a63" text-anchor="start"><tspan x="70" dy="0">Four levels of correctness: from parseable to decision-ready</tspan></text><path d="M 70 94 C 265 87, 485 102, 710 93" fill="none" stroke="#d97706" stroke-width="7" stroke-linecap="round" opacity=".85"/><text x="72" y="128" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#526a82" text-anchor="start"><tspan x="72" dy="0">Outer layers require more semantic judgment; high outer-layer scores cannot offset inner-layer failures.</tspan></text>
