<title id="whiteboard-title">Context Engineering is a runtime data pipeline</title>
<desc id="whiteboard-desc">Chapter 04 architecture diagrams for Production-Grade Multi-Agent Systems, using deterministic whiteboard wireframes to show control flow and evidence or responsibility boundaries.</desc>

