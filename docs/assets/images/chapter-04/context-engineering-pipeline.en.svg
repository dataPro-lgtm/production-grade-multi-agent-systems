<text x="800" y="660" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="17.2" font-weight="500" fill="#526a82" text-anchor="middle" opacity="1"><tspan x="800" dy="0">Record candidates, rejection reasons, transformations, Omissions, Pack Hash, and evaluation results</tspan></text>
<path d="M 1320 465 C 1320 463, 1320 587, 1320 585" fill="none" stroke="#173a63" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow-1e3a5f)"/>
<text x="800" y="785" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="700" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="800" dy="0">The model is only a consumer; selection, authorization, temporal checks, Evidence, and budgets belong to the runtime.</tspan></text>

