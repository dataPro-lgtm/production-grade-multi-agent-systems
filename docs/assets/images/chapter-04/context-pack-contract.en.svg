<rect x="1160" y="210" width="380" height="525" rx="22" fill="#ffffff" stroke="#c73e3e" stroke-width="3"/><rect x="1162" y="209" width="379" height="526" rx="23" fill="none" stroke="#c73e3e" stroke-width="1.2" opacity=".32" transform="rotate(.18 1350 472.5)"/>
<text x="1350" y="270" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="25.4" font-weight="760" fill="#c73e3e" text-anchor="middle" opacity="1"><tspan x="1350" dy="0">Six invariants</tspan></text>
<text x="1200" y="340" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="18.9" font-weight="500" fill="#173a63" text-anchor="start" opacity="1"><tspan x="1200" dy="0">① Relevant: serves the current task</tspan><tspan x="1200" dy="35.65">② Authorized: user and purpose permitted</tspan><tspan x="1200" dy="35.65">③ Timely: meets as_of / freshness</tspan><tspan x="1200" dy="35.65">④ Traceable: source / version / Locator</tspan><tspan x="1200" dy="35.65">⑤ Budgeted: policy-based selection</tspan><tspan x="1200" dy="35.65">⑥ Evaluable: can be saved and replayed</tspan></text>
<text x="800" y="805" font-family="'Chalkboard SE','Comic Sans MS','Arial',sans-serif" font-size="22.1" font-weight="700" fill="#2f7d67" text-anchor="middle" opacity="1"><tspan x="800" dy="0">A Chunk becomes Evidence only when bound to source, time, permissions, Locator, and Claim.</tspan></text>

